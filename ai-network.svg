<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Open-source AI network</title>
  <desc id="desc">An abstract network of connected contributors orbiting an open AI core.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#1d2420"/>
      <stop offset="0.62" stop-color="#101411"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d2b477"/>
      <stop offset="1" stop-color="#709b89"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <circle cx="500" cy="500" r="475" fill="url(#field)" stroke="#c8a56a" stroke-opacity=".52" stroke-width="2"/>
  <circle cx="500" cy="500" r="384" fill="none" stroke="#f3efe5" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="500" cy="500" r="275" fill="none" stroke="#709b89" stroke-opacity=".32" stroke-width="2" stroke-dasharray="4 14"/>

  <g fill="none" stroke-linecap="round">
    <path d="M500 500C390 360 286 292 185 272" stroke="#c8a56a" stroke-opacity=".62" stroke-width="3"/>
    <path d="M500 500C615 350 715 270 820 224" stroke="#709b89" stroke-opacity=".68" stroke-width="3"/>
    <path d="M500 500C690 510 786 568 874 660" stroke="#c8a56a" stroke-opacity=".52" stroke-width="3"/>
    <path d="M500 500C594 665 620 750 610 846" stroke="#709b89" stroke-opacity=".62" stroke-width="3"/>
    <path d="M500 500C360 660 276 718 170 742" stroke="#c8a56a" stroke-opacity=".54" stroke-width="3"/>
    <path d="M185 272C400 175 635 160 820 224" stroke="#f3efe5" stroke-opacity=".1" stroke-width="2"/>
    <path d="M170 742C400 850 665 846 874 660" stroke="#f3efe5" stroke-opacity=".1" stroke-width="2"/>
  </g>

  <g fill="#c8a56a" opacity=".12" filter="url(#soft)">
    <circle cx="185" cy="272" r="34"/><circle cx="820" cy="224" r="34"/><circle cx="874" cy="660" r="34"/><circle cx="610" cy="846" r="34"/><circle cx="170" cy="742" r="34"/>
  </g>
  <g stroke-width="3">
    <circle cx="185" cy="272" r="12" fill="#c8a56a" stroke="#f3efe5" stroke-opacity=".5"/>
    <circle cx="820" cy="224" r="12" fill="#709b89" stroke="#f3efe5" stroke-opacity=".5"/>
    <circle cx="874" cy="660" r="12" fill="#c8a56a" stroke="#f3efe5" stroke-opacity=".5"/>
    <circle cx="610" cy="846" r="12" fill="#709b89" stroke="#f3efe5" stroke-opacity=".5"/>
    <circle cx="170" cy="742" r="12" fill="#c8a56a" stroke="#f3efe5" stroke-opacity=".5"/>
  </g>

  <circle cx="500" cy="500" r="154" fill="#111512" stroke="url(#signal)" stroke-width="3"/>
  <circle cx="500" cy="500" r="130" fill="none" stroke="#f3efe5" stroke-opacity=".12"/>
  <text x="500" y="470" text-anchor="middle" fill="#f3efe5" font-family="Georgia, serif" font-size="104" letter-spacing="-7">AI</text>
  <path d="M415 525H585" stroke="url(#signal)" stroke-width="3"/>
  <text x="500" y="568" text-anchor="middle" fill="#c8a56a" font-family="ui-monospace, monospace" font-size="21" font-weight="700" letter-spacing="7">OPEN SOURCE</text>

  <g fill="#a5aaa2" font-family="ui-monospace, monospace" font-size="17" letter-spacing="3">
    <text x="128" y="235">BUILD</text>
    <text x="805" y="185">SHARE</text>
    <text x="850" y="708">LEARN</text>
    <text x="566" y="894">SCALE</text>
    <text x="105" y="790">CONNECT</text>
  </g>
</svg>
